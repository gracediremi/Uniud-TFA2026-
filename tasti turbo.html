<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2540">
<title>Tasti Turbo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a2540;--card:#133863;--ink:#f0f9ff;--mute:#93c5fd;--y:#ffd23f;--r:#ff6b6b;--g:#3ddc97;--b:#38bdf8;--on:#0a2540;--sky1:#020617;--sky2:#0b1e45;--sky3:#1e3a8a;--cloud:#8ea2d0;--clop:.55;--stars:1;--sun:0;--moon:1}
:root[data-theme="light"]{color-scheme:light;--bg:#e0f2fe;--card:#ffffff;--ink:#0c4a6e;--mute:#0369a1;--on:#0c4a6e;--sky1:#2f9bea;--sky2:#7dd3fc;--sky3:#e0f2fe;--cloud:#ffffff;--clop:.95;--stars:0;--sun:1;--moon:0}
:root[data-upper="true"], :root[data-upper="true"] button, :root[data-upper="true"] input, :root[data-upper="true"] textarea{text-transform:uppercase}
:root[data-upper="true"] ::placeholder{text-transform:uppercase}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:transparent;color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3,button,.big{font-family:Fredoka,"Trebuchet MS",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--card);font-weight:700;transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.12)}button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--b);outline-offset:3px}
button[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.wrap{max-width:900px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:2.1rem;margin:0}h1 span{display:inline-block;background:var(--y);color:var(--on);padding:0 .35em;border-radius:12px;transform:rotate(-3deg)}
.badge{background:var(--card);border:2px solid var(--y);border-radius:99px;padding:4px 14px;font-weight:800}
nav,.lv,.chips,.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
nav button[aria-pressed=true]{background:var(--y);color:var(--on)}
.lv button[aria-pressed=true]{background:var(--g);color:var(--on)}
.chips button[aria-pressed=true]{background:var(--b);color:var(--on)}
.go{background:var(--r);color:white;font-size:1.08rem}
.panel{background:var(--card);border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 8px 24px #00000012}
.panel h2{margin:.1em 0 .3em;font-size:1.7rem}.em{font-size:3.2rem;line-height:1.15}
input,textarea{background:var(--bg);border:2px solid var(--mute);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:100px}
.row input{flex:1;min-width:180px;width:auto}
.hud{display:flex;gap:14px;flex-wrap:wrap;font-weight:800;margin:10px 0}
.hud b{font:700 1.6rem Fredoka;color:var(--y)}
.target{font:1.2rem/1.9 "Courier New",monospace;overflow-wrap:anywhere;margin:8px 0 12px}
.target .c{color:var(--g)}.target .x{color:white;background:var(--r);border-radius:3px}.target .k{border-bottom:3px solid var(--y)}
.word{font-size:2.8rem;text-align:center;margin:10px 0;min-height:1.3em;overflow-wrap:anywhere}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:12px 0}
.cat{border-radius:16px;padding:10px;text-align:center;color:var(--on);font-weight:800}.cat .big{font-size:2rem}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--bg)}
.ok{background:var(--g)!important;color:var(--on)}.no{background:var(--r)!important;color:white}
.bar{position:relative;height:12px;background:var(--bg);border-radius:99px;margin:14px 14px 10px}.bar i{display:block;position:relative;height:100%;width:100%;background:var(--y);border-radius:99px;transition:width .25s linear}.bar i:after{content:'⭐';position:absolute;right:0;top:50%;transform:translate(50%,-50%);font-size:1.7rem;line-height:1;filter:drop-shadow(0 2px 3px #0006)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stats .panel{margin:0}.stats .big{font-size:2.2rem;color:var(--y)}
.bd{text-align:center;opacity:.48;background:var(--bg);border-radius:16px;padding:12px}.bd.on{opacity:1;outline:3px solid var(--g)}.bd .em{font-size:2.2rem}
.tblwrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}td,th{padding:7px 10px;text-align:left;border-bottom:1px solid var(--mute)}
small,.mute{color:var(--mute)}.hint{font-size:.95rem;color:var(--mute)}
.qchip{background:var(--bg);border:1px solid var(--mute);font-size:.9rem;padding:6px 12px}
.shake{animation:sh .25s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pop{animation:pp .35s}@keyframes pp{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
.sayall{float:right;margin:0 0 6px 10px;padding:6px 12px;font-size:.9rem;background:var(--bg);border:1px solid var(--mute)}
.sp{background:var(--b);color:var(--on)}

/* Voce disattivata: i pulsanti di lettura restano muti e disabilitati visivamente */
:root[data-voice="off"] .sayall,:root[data-voice="off"] #listen,:root[data-voice="off"] #rep{opacity:.42;cursor:not-allowed}

/* Corso di tastiera interattivo */
:root{--f1:#f87171;--f2:#fb923c;--f3:#facc15;--f4:#4ade80;--f5:#94a3b8;--f6:#2dd4bf;--f7:#38bdf8;--f8:#a78bfa;--f9:#f472b6}
.kb{display:flex;flex-direction:column;gap:4px;margin:10px 0;user-select:none}
.kr{display:flex;gap:4px}
.key{flex:var(--w) 1 0;min-width:0;height:clamp(28px,5.2vw,42px);border-radius:7px;background:var(--bg);border:2px solid var(--fc,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 clamp(.58rem,1.7vw,.9rem)/1 Fredoka,sans-serif;color:var(--ink);transition:transform .08s,background .12s;overflow:hidden;white-space:nowrap}
.key small{font-size:.72em;color:var(--mute);margin-bottom:1px}
.key.sp{border-color:transparent;background:none}
.key.fo{background:color-mix(in srgb,var(--fc) 38%,var(--bg))}
.key.tg{background:var(--fc);color:#0a2540;transform:translateY(-2px) scale(1.07);box-shadow:0 0 14px var(--fc);position:relative;z-index:1}
.key.tg small{color:#0a2540}
.key.bad{background:var(--r)!important;color:#fff;animation:sh .25s}
.key.ok{background:var(--g)!important;color:var(--on)}
.cue{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0}
.cap{min-width:72px;height:72px;padding:0 16px;border-radius:16px;display:flex;align-items:center;justify-content:center;font:700 2rem Fredoka,sans-serif;background:var(--y);color:var(--on);box-shadow:0 5px 0 #0003}
.sr{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.fleg{display:flex;gap:6px 14px;flex-wrap:wrap;margin:6px 0}.fleg span{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;color:var(--mute)}.fleg i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* Arcade e sfida contro l'IA */
.arc canvas{display:block;width:100%;height:420px;border-radius:16px;background:linear-gradient(180deg,#020617,#0b1e45 70%,#1e3a8a);box-shadow:inset 0 0 0 2px #ffffff22;touch-action:manipulation}
.arc .row input{font-size:1.2rem;font-family:"Courier New",monospace}
.vs{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--r);margin:6px 14px 2px}.vs i{display:block;height:100%;width:50%;background:var(--g);transition:width .3s}
.vsl{display:flex;justify-content:space-between;font-size:.9rem;margin:0 14px 8px;color:var(--mute);font-weight:800}

/* Cartella Opzioni di gioco */
.opts{flex:1 1 100%;background:var(--card);border-radius:16px;padding:0}
.opts summary{cursor:pointer;list-style:none;padding:10px 16px;font:700 1rem Fredoka,sans-serif;border-radius:16px;user-select:none}
.opts summary::-webkit-details-marker{display:none}
.opts summary:before{content:'▸';display:inline-block;margin-right:8px;transition:transform .15s}
.opts[open] summary:before{transform:rotate(90deg)}
.opts summary:focus-visible{outline:3px solid var(--b);outline-offset:3px}
.opts .optbody{display:flex;gap:8px;flex-wrap:wrap;padding:4px 14px 14px}
.opts .optbody button{background:var(--bg)}
.opts .optbody button[aria-pressed=true]{background:var(--g);color:var(--on)}

/* Menu a tre righe: Dashboard/Report/Opzioni · Sfide · Livelli */
#nav,#games,#lv{margin:8px 0;align-items:center}
#games:empty,#lv:empty{display:none}
#games button[aria-pressed=true]{background:var(--y);color:var(--on)}
.glab{font:700 .95rem Fredoka,sans-serif;color:var(--mute);min-width:5.6em}
#nav .opts{flex:0 0 auto}#nav .opts[open]{flex:1 1 100%}
select{font:inherit;color:inherit;background:var(--bg);border:2px solid var(--mute);border-radius:12px;padding:8px 10px}
.tbtn{padding:4px 10px;font-size:.85rem;background:var(--bg)}

/* SFONDO: cielo giorno/notte con nuvole in movimento */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%)}
.stars{position:absolute;inset:0;opacity:var(--stars);transition:opacity .6s}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.sun,.moon{position:absolute;top:11%;right:8%;width:clamp(56px,9vw,96px);aspect-ratio:1;border-radius:50%;transition:opacity .6s}
.sun{background:radial-gradient(circle at 40% 40%,#fff7b0,#ffd23f 60%,#ffb703);box-shadow:0 0 0 14px #ffd23f33,0 0 70px 30px #fde04766;opacity:var(--sun);animation:sunp 6s ease-in-out infinite}
@keyframes sunp{50%{transform:scale(1.05)}}
.moon{background:radial-gradient(circle at 62% 58%,#cfcaa8 0 9%,#0000 10%),radial-gradient(circle at 36% 70%,#d8d4b5 0 6%,#0000 7%),radial-gradient(circle at 48% 28%,#d8d4b5 0 5%,#0000 6%),radial-gradient(circle at 35% 35%,#fffbe6,#e8e4c9 70%);box-shadow:0 0 50px 18px #e0e7ff44;opacity:var(--moon)}
.clouds{position:absolute;left:0;right:0;bottom:0;height:48vh;opacity:var(--clop);transition:opacity .6s}
.layer{position:absolute;left:0;display:flex;width:max-content;fill:var(--cloud);animation:drift linear infinite}
.layer svg{flex:none;height:auto;display:block}
.l1{bottom:20%;opacity:.6;animation-duration:200s}.l1 svg{width:max(100vw,800px)}
.l2{bottom:8%;opacity:.8;animation-duration:130s}.l2 svg{width:max(130vw,1100px)}
.l3{bottom:-3%;opacity:1;animation-duration:85s}.l3 svg{width:max(170vw,1400px)}
@keyframes drift{to{transform:translateX(-50%)}}

/* Immagine dello Speed Test */
.pic{margin:0 0 12px;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 6px 18px #0003;background:var(--bg)}
.pic img{display:block;width:100%;height:clamp(130px,26vh,230px);object-fit:cover;object-position:center 30%;animation:pp .5s}
.pic figcaption{position:absolute;left:10px;bottom:10px;background:#0b1d33cc;color:#fff;padding:3px 12px;border-radius:99px;font:700 1rem Fredoka,sans-serif}
.pic.art{height:clamp(130px,26vh,230px);display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,hsl(var(--h) 80% 62%),hsl(calc(var(--h) + 50) 85% 45%))}
.pic .emo{font-size:clamp(4.5rem,14vh,7.5rem);animation:flt 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 8px #0004)}
@keyframes flt{50%{transform:translateY(-8px) rotate(3deg)}}
.credit{font-size:.8rem;color:var(--mute);margin:-4px 0 8px}.credit a{color:inherit}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
@media(max-width:520px){.wrap{padding:12px}h1{font-size:1.8rem}.panel{padding:16px}.word{font-size:2.2rem}.target{font-size:1.05rem}}
</style>
</head>

<script>
'use strict';
const $=s=>document.querySelector(s);
const main=$('#main');

 const l=normLang(lang),c=voices.filter(v=>normLang(v.lang).startsWith(l.slice(0,2)));

let lastSay='',lastT=0;

function speak(text,lang='it-IT',force=false){
 if(!TTS||!voiceOn){stopSpeech();return;}
 const t=clean(text,lang);if(!t)return;
 const now=Date.now();if(!force&&t===lastSay&&now-lastT<500)return;
 lastSay=t;lastT=now;
 synth.cancel();
 (t.match(/[^.!?;\n]+[.!?;]*/g)||[t]).forEach(part=>{
  part=part.trim();if(!part)return;
  const u=new SpeechSynthesisUtterance(part);u.lang=lang;
  const v=pickVoice(lang);if(v)u.voice=v;
  u.rate=slow?0.7:0.95;synth.speak(u);
 });
}
function textOf(root,soft){
 const out=[];
 (function walk(n){
  if(n.nodeType===3){const t=n.nodeValue.replace(/\s+/g,' ').trim();if(t)out.push(t);return;}
  if(n.nodeType!==1||n.matches('button,textarea,input,select,script,style,.sayall,.bar,[hidden],[aria-hidden="true"]'))return;
  if(n.dataset&&n.dataset.say){out.push(n.dataset.say);return;}
  const blk=getComputedStyle(n).display!=='inline';
  if(blk)out.push('\n');
  n.childNodes.forEach(walk);
  if(blk)out.push('\n');
 })(root);
 const segs=out.join(' ').split('\n').map(x=>x.trim()).filter(Boolean);
 return soft?segs.join(', '):segs.map(x=>/[.!?:;,]$/.test(x)?x:x+'.').join(' ');
}

/* CONTEGGIO DIGITAZIONE */
function typingStats(target,v){
 const tw=target.split(' '),tv=v.split(' '),marks=new Array(target.length).fill('');
 let correct=0,wrong=0,pos=0,cursor=-1;
 for(let j=0;j<tw.length;j++){
  const W=tw[j],T=tv[j],closed=j<tv.length-1;
  if(T!==undefined){
   for(let k=0;k<W.length;k++){
    const i=pos+k;
    if(k<T.length){if(T[k]===W[k]){marks[i]='c';correct++;}else{marks[i]='x';wrong++;}}
    else if(closed){marks[i]='x';wrong++;}
    else if(k===T.length)cursor=i;
   }
   const extra=Math.max(0,T.length-W.length),sp=pos+W.length;
   wrong+=extra;
   if(j<tw.length-1){
    if(closed)marks[sp]=T.length===W.length?'c':'x',correct+=T.length===W.length?1:0;
    else if(T.length>=W.length){cursor=sp;if(extra)marks[sp]='x';}
   }
  }
  pos+=W.length+1;
 }
 for(let j=tw.length;j<tv.length;j++)wrong+=tv[j].length+1;
 const last=tw.length-1,done=tv.length>tw.length||(tv.length===tw.length&&tv[last].length>=tw[last].length);
 return{correct,errors:wrong,total:correct+wrong,marks,cursor,done};
}

  if(b.dataset.detail){tstudent=b.dataset.detail;back();return;}
  else if(b.dataset.one){const x=all.find(y=>y.k===b.dataset.one);if(x)ok=dlFile(fileSlug(x.p.nome+' '+x.p.cognome)+'.txt',reportText(x.p,x.pts,x.results),'text/plain');}
  else if(b.dataset.tdl==='sum')ok=dlFile(`riepilogo-tasti-turbo${tag}-${day}.csv`,toCSV([['Cognome','Nome','Classe','Punti','Esercizi','Record velocità','Precisione media %','Lezioni Tap de Tasto superate'],...list.map(x=>{const s=sumOf(x);return[x.p.cognome,x.p.nome,x.p.classe,x.pts,s.n,s.best,s.acc,s.les];})]),'text/csv');
  else if(b.dataset.tdl==='det')ok=dlFile(`esercizi-tasti-turbo${tag}-${day}.csv`,toCSV([['Cognome','Nome','Classe','N.','Esercizio','Livello','Velocità','Precisione %','Errori','Secondi','Dettagli','Sfida','Tasti con errori'],...list.flatMap(x=>x.results.map((r,i)=>[x.p.cognome,x.p.nome,x.p.classe,i+1,r.mode,r.lvl,r.wpm,r.acc,r.err,r.sec||'',r.extra||'',r.vs||'',Object.entries(r.keyErrors||{}).map(([k,n])=>keyLabel(k)+': '+n).join(', ')]))]),'text/csv');
  else if(b.dataset.tdl==='txt')ok=dlFile(`report-completi-tasti-turbo${tag}-${day}.txt`,list.map(x=>reportText(x.p,x.pts,x.results)).join('\n'+'='.repeat(50)+'\n\n'),'text/plain');
  else if(b.id==='tpin'){const old=prompt('Inserisci il PIN docente attuale:');if(old===null)return;if(old!==teacherPin()){alert('PIN non corretto.');return;}const np=prompt('Scegli un nuovo PIN (almeno 6 caratteri):');if(np===null)return;if(np.trim().length<6){alert('Il PIN deve contenere almeno 6 caratteri.');return;}localStorage.setItem(T_PIN_KEY,np.trim());$('#tmsg').textContent='PIN aggiornato su questo dispositivo.';return;}
  else if(b.id==='tlock'){tUnlock=false;tstudent='';back();return;}  if(ok!==null)$('#tmsg').textContent=ok?'Download avviato!':'Download non riuscito su questo browser.';
 });
}
function docente(){
 stopTimer();
 main.innerHTML=`<div class="row"><button type="button" id="tback" data-nosay="1">← Torna all&#39;accesso</button></div><div id="tbox"></div>`;
 $('#tback').onclick=()=>go('dash');
 renderTeacher($('#tbox'),docente);
}
function decorate(){
 if(!TTS)return;
 main.querySelectorAll('.panel').forEach(p=>{
  if(p.closest('.stats')||p.querySelector(':scope > .sayall')||p.querySelector('#tg,#wd,#ta,#cv,.kb'))return;
  const b=document.createElement('button');b.type='button';b.className='sayall';b.dataset.nosay='1';
  b.setAttribute('aria-label','Leggi ad alta voce');b.textContent='🔊 Leggi';
  b.disabled=!voiceOn;b.setAttribute('aria-disabled',String(!voiceOn));
  p.prepend(b);
 });
}
new MutationObserver(()=>requestAnimationFrame(decorate)).observe(main,{childList:true,subtree:true});
load();go('dash');
</script>
